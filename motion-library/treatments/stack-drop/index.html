<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=1080, height=960"/>
<title>Stack drop</title>
<script src="gsap.min.js"></script><link rel="stylesheet" href="brand.css"/><link rel="stylesheet" href="kit.css"/>
<style>
html, body, #root { width: 1080px; height: 960px; }
#hero { position: absolute; inset: 0; }
#pile { position: absolute; left: 0; top: 0; width: 1080px; height: 960px; transform-origin: 540px 860px; }
.it { position: absolute; left: 110px; width: 860px; height: 128px; border-radius: 40px; transform-origin: 50% 100%; }
.it img { position: absolute; left: 34px; top: 20px; width: 88px; height: 88px; }
.it .trk { position: absolute; left: 160px; right: 44px; top: 48px; height: 32px; border-radius: 16px; background: var(--paper-2); overflow: hidden; }
.it .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 16px; background: linear-gradient(90deg, var(--accent), var(--accent-deep)); }
.it .q { position: absolute; top: 6px; width: 20px; height: 20px; border-radius: 50%; background: var(--paper); opacity: .9; }
#lab { left: 0; right: 0; top: 40px; text-align: center; font-size: 96px; text-transform: uppercase; }
#floor { left: 120px; right: 120px; top: 872px; height: 8px; border-radius: 4px; background: var(--on-paper); transform-origin: 50% 50%; }
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4.6" data-fps="30" data-width="1080" data-height="960">
  <div id="hero">
    <div id="lab" class="abs disp">Queue</div>
    <div id="floor" class="abs"></div>
    <div id="pile"></div>
  </div>
</div>
<script src="kit.js"></script>
<script>
(function () {
/* INPUTS: 3 to 6 items (real logo each), label (1 word). Each card is one item; the queue bar says "waiting", not a word. */
const IN = { logos: ['sample-a', 'sample-b', 'sample-c', 'sample-d', 'sample-e'], fills: [.10, .18, .07, .14, .22] };
const C = K.C, root = document.getElementById('root'); K.ground(root, { seed: 71 });
const tl = K.timeline(4.6); window.__timelines['main'] = tl;
const $ = id => document.getElementById(id), pile = $('pile'), r = K.rng(12);
const BOTTOM = 864, STEP = 140, T0 = .35, DT = .44;
const cards = IN.logos.map((lg, i) => {
  const top = BOTTOM - 128 - i * STEP, rot = (r() - .5) * 3.2;
  const c = K.el(pile, 'it card', { top: top + 'px' }, `<img src="logos/${lg}.svg" alt="${lg}"/><div class="trk"><div class="fill" style="width:${IN.fills[i] * 100}%"></div></div>`);
  const qs = [0, 1, 2].map(k => K.el(c.querySelector('.trk'), 'q', { left: (IN.fills[i] * 656 + 16 + k * 36) + 'px' }));
  const t = T0 + i * DT;
  tl.fromTo(c, { y: -760 - i * 40, rotation: (r() - .5) * 18, opacity: 1 }, { y: 0, rotation: rot, duration: .38, ease: 'power3.in' }, t);
  tl.to(c, { scaleY: .9, scaleX: 1.02, duration: .06, ease: 'power2.out' }, t + .38);
  tl.to(c, { scaleY: 1, scaleX: 1, duration: .45, ease: 'back.out(4)' }, t + .44);
  return { c, qs, t };
});
// every impact presses the cards underneath (the stack has weight)
cards.forEach((k, i) => { for (let j = 0; j < i; j++) { tl.to(cards[j].c, { y: 5 + (i - j) * .6, duration: .06, ease: 'power2.out' }, k.t + .38);
  tl.to(cards[j].c, { y: 0, duration: .4, ease: 'back.out(3)' }, k.t + .44); } });
tl.fromTo('#floor', { scaleX: 0 }, { scaleX: 1, duration: .45, ease: 'expo.out' }, 0);
// queue dots shuffle forever: waiting, shown not said
K.every(t => cards.forEach((k, i) => k.qs.forEach((q, j) => { const ph = (t * 1.6 + j * .33 + i * .17) % 1; q.style.transform = `translateY(${(-Math.abs(Math.sin(ph * Math.PI)) * 0).toFixed(1)}px) scale(${(.6 + .5 * Math.sin(ph * Math.PI)).toFixed(3)})`; })), 0, 4.6);
K.rise($('lab'), 2.55, 40, .45);
K.kick($('lab'), 3.3, .04);
tl.to(pile, { rotation: 1.2, duration: .5, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 2.9);
// exit: the pile tips away
cards.slice().reverse().forEach((k, i) => tl.to(k.c, { y: 1000, rotation: (i % 2 ? -1 : 1) * 14, duration: .4, ease: 'power3.in' }, 4.1 + i * .04));
tl.to(['#lab', '#floor'], { opacity: 0, duration: .3, ease: 'power2.in' }, 4.2);
K.finish();
})();
</script></body></html>
