<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=1080, height=960"/>
<title>Logo plug</title>
<script src="gsap.min.js"></script><link rel="stylesheet" href="brand.css"/><link rel="stylesheet" href="kit.css"/>
<style>
html, body, #root { width: 1080px; height: 960px; }
#hero { position: absolute; inset: 0; }
.tile { position: absolute; top: 170px; width: 360px; height: 360px; border-radius: 88px; display: flex; align-items: center; justify-content: center; }
.tile img { width: 210px; height: 210px; }
#ta { left: 90px; } #tb { left: 630px; }
#glow { position: absolute; left: 618px; top: 158px; width: 384px; height: 384px; border-radius: 98px; border: 8px solid var(--accent-deep); opacity: 0; }
#plug { left: 0; top: 0; width: 64px; height: 84px; margin: -42px 0 0 -32px; }
#sock { left: 774px; top: 530px; width: 72px; height: 44px; border-radius: 0 0 18px 18px; background: var(--on-paper); }
#pill { left: 340px; width: 400px; top: 774px; height: 96px; border-radius: 48px; background: var(--paper); color: var(--accent-deep); font-size: 44px;
  display: flex; align-items: center; justify-content: center; box-shadow: var(--cast); border: 6px solid var(--accent-deep); }
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4.6" data-fps="30" data-width="1080" data-height="960">
  <div id="hero">
    <svg id="wire" class="layer" width="1080" height="960"></svg>
    <div id="sock" class="abs"></div>
    <div id="glow"></div>
    <div id="ta" class="tile card"><img src="logos/sample-a.svg" alt="Sample A"/></div>
    <div id="tb" class="tile card"><img src="logos/sample-b.svg" alt="Sample B"/></div>
    <svg id="plug" class="abs" viewBox="0 0 64 84"><rect x="14" y="0" width="9" height="22" rx="3" fill="var(--on-paper)"/><rect x="41" y="0" width="9" height="22" rx="3" fill="var(--on-paper)"/>
      <rect x="4" y="18" width="56" height="50" rx="14" fill="var(--accent-deep)" stroke="var(--paper)" stroke-width="5"/><rect x="24" y="66" width="16" height="18" rx="4" fill="var(--on-paper)"/></svg>
    <div id="pill" class="abs mono">Connected</div>
  </div>
</div>
<script src="kit.js"></script>
<script>
(function () {
/* INPUTS: logo A (the thing), logo B (where it runs / what it joins), label (max 2 words). */
const C = K.C, root = document.getElementById('root'); K.ground(root, { seed: 81 });
const tl = K.timeline(4.6); window.__timelines['main'] = tl;
const $ = id => document.getElementById(id), wire = $('wire');
const d = K.rounded([[270, 540], [270, 822], [810, 822], [810, 600]], 90);
const under = K.mk(wire, 'path', { d, fill: 'none', stroke: 'var(--paper)', 'stroke-width': 30, 'stroke-linecap': 'round' });
const cable = K.mk(wire, 'path', { d, fill: 'none', stroke: C.onPaper, 'stroke-width': 16, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
const lit = K.mk(wire, 'path', { d, fill: 'none', stroke: C.accent, 'stroke-width': 6, 'stroke-linecap': 'round', opacity: 0 });
const S = K.sampler(cable);
K.land($('ta'), 0, { x: -160, scale: .85, y: 0, rotation: -8 }, .55, 'back.out(1.6)');
K.land($('tb'), .2, { x: 160, scale: .85, y: 0, rotation: 8 }, .55, 'back.out(1.6)');
tl.fromTo('#sock', { scaleY: 0, transformOrigin: '50% 0%' }, { scaleY: 1, duration: .3, ease: 'back.out(2)' }, .55);
// the cable pays out with the plug riding its head, then clicks into the socket
const P = { u: 0 };
[under, cable].forEach(p => K.draw(p, .6, .62, 'power2.inOut'));
tl.fromTo(P, { u: 0 }, { u: 1, duration: .62, ease: 'power2.inOut', onUpdate: () => { const a = S.at(P.u), b = S.at(Math.max(0, P.u - .01));
  const ang = Math.atan2(a[1] - b[1], a[0] - b[0]) * 180 / Math.PI + 90; $('plug').style.transform = `translate(${a[0]}px,${a[1]}px) rotate(${ang.toFixed(1)}deg)`; } }, .6);
tl.fromTo('#plug', { opacity: 0 }, { opacity: 1, duration: .1 }, .6);
K.kick($('tb'), 1.34, .05); K.kick($('ta'), 1.38, .03);
K.pulse($('hero'), 810, 560, 90, 1.34, C.deep, 8);
tl.to('#glow', { opacity: 1, duration: .25, ease: 'power2.out' }, 1.34);
tl.to(lit, { attr: { opacity: 1 }, duration: .2 }, 1.4);
// data streams through: the pairing is alive
for (let t = 1.5; t < 3.9; t += .3) K.packet($('hero'), cable, t, .75, C.deep, 42, 'none');
K.land($('pill'), 1.9, { scale: .7, y: 30 }, .5, 'back.out(2.2)');
tl.to('#glow', { opacity: .35, duration: .35, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 2.4);
K.kick($('pill'), 3.2, .05);
K.exit($('hero'), 4.2, .38);
K.finish();
})();
</script></body></html>
