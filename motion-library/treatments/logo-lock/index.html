<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=1080, height=960"/>
<title>Logo lock</title>
<script src="gsap.min.js"></script><link rel="stylesheet" href="brand.css"/><link rel="stylesheet" href="kit.css"/>
<style>
html, body, #root { width: 1080px; height: 960px; }
#hero { position: absolute; inset: 0; }
#tile { left: 310px; top: 110px; width: 460px; height: 460px; border-radius: 108px; display: flex; align-items: center; justify-content: center; }
#tile img { width: 270px; height: 270px; }
#lab { left: 0; right: 0; top: 628px; text-align: center; font-size: 104px; text-transform: uppercase; }
#pill { left: 360px; width: 360px; top: 766px; height: 100px; border-radius: 50px; background: var(--alarm); color: var(--paper); font-size: 48px;
  display: flex; align-items: center; justify-content: center; box-shadow: 0 18px 36px -14px color-mix(in srgb, var(--alarm) 70%, transparent); }
#lock { left: 668px; top: 400px; width: 190px; height: 230px; transform-origin: 95px 0px; }
#cursor { left: 0; top: 0; width: 84px; height: 84px; transform-origin: 8px 6px; }
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4.6" data-fps="30" data-width="1080" data-height="960">
  <div id="hero">
    <div id="tile" class="card"><img id="logo" src="logos/sample-a.svg" alt="Sample"/></div>
    <div id="lab" class="abs disp">Product</div>
    <div id="pill" class="abs mono">Locked</div>
    <svg id="lock" class="abs" viewBox="0 0 190 230" style="overflow:visible">
      <path id="shackle" d="M48 110 V70 a47 47 0 0 1 94 0 V110" fill="none" stroke="var(--on-paper)" stroke-width="22" stroke-linecap="round"/>
      <rect x="8" y="96" width="174" height="130" rx="32" fill="var(--alarm)" stroke="var(--paper)" stroke-width="8"/>
      <circle cx="95" cy="150" r="17" fill="var(--paper)"/><rect x="87" y="156" width="16" height="40" rx="8" fill="var(--paper)"/>
    </svg>
    <svg id="cursor" class="abs" viewBox="0 0 84 84"><path d="M8 6 L8 66 L24 52 L36 78 L48 72 L36 47 L58 46 Z" fill="var(--on-paper)" stroke="var(--paper)" stroke-width="5" stroke-linejoin="round"/></svg>
  </div>
</div>
<script src="kit.js"></script>
<script>
(function () {
/* INPUTS: logo svg (real mark), name (1 word), state word (1 word). */
const C = K.C, root = document.getElementById('root'); K.ground(root, { seed: 21 });
const tl = K.timeline(4.6); window.__timelines['main'] = tl;
const $ = id => document.getElementById(id);
K.land($('tile'), 0.0, { scale: .8, y: 70 }, .6, 'back.out(1.6)');
tl.fromTo($('logo'), { scale: .55, rotation: -40, opacity: 0, filter: 'grayscale(0) opacity(1)' }, { scale: 1, rotation: 0, opacity: 1, duration: .6, ease: 'back.out(2.2)' }, .25);
tl.to($('logo'), { rotation: 90, duration: 1.0, ease: 'power2.inOut' }, .9);                 // the live mark turns once, alive
K.rise($('lab'), .55, 30);
// the lock falls in with the shackle open, lands, then snaps shut on the beat
tl.fromTo($('lock'), { y: -560, opacity: 0, rotation: -14 }, { y: 0, opacity: 1, rotation: 0, duration: .42, ease: 'power3.in' }, 1.0);
tl.fromTo($('shackle'), { y: -34 }, { y: -34, duration: .01 }, 0);
tl.to($('lock'), { scaleY: .86, scaleX: 1.1, duration: .07, ease: 'power2.out', transformOrigin: '95px 230px' }, 1.42);
tl.to($('lock'), { scaleY: 1, scaleX: 1, duration: .4, ease: 'back.out(4)' }, 1.49);
tl.to($('shackle'), { y: 0, duration: .12, ease: 'power4.in' }, 1.62);
K.kick($('tile'), 1.74, .05);
tl.to($('logo'), { filter: 'grayscale(1) opacity(0.38)', duration: .35, ease: 'power2.out' }, 1.74);
K.pulse($('hero'), 540, 340, 260, 1.74, C.alarm, 9);
K.land($('pill'), 1.95, { scale: .7, y: 20 }, .45, 'back.out(2.4)');
// someone tries to use it: cursor reaches the tile, clicks, the tile says no
tl.fromTo($('cursor'), { x: 120, y: 980, opacity: 0 }, { x: 470, y: 330, opacity: 1, duration: .6, ease: 'power3.out' }, 2.35);
tl.to($('cursor'), { scale: .82, duration: .06 }, 3.0); tl.to($('cursor'), { scale: 1, duration: .2, ease: 'back.out(3)' }, 3.06);
K.shake($('tile'), 3.06, 22, 6); K.shake($('lock'), 3.1, 10, 5);
K.pulse($('hero'), 540, 340, 260, 3.08, C.alarm, 8);
tl.to($('cursor'), { x: 300, y: 1000, duration: .5, ease: 'power2.in' }, 3.6);
tl.to($('lock'), { rotation: 6, duration: .35, ease: 'sine.inOut', yoyo: true, repeat: 1, transformOrigin: '95px 0px' }, 3.55);
K.exit($('hero'), 4.2, .38);
K.finish();
})();
</script></body></html>
