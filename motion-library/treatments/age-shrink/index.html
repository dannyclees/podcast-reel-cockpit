<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=1080, height=960"/>
<title>Age shrink</title>
<script src="gsap.min.js"></script><link rel="stylesheet" href="brand.css"/><link rel="stylesheet" href="brand.css"/><link rel="stylesheet" href="kit.css"/>
<style>
html, body, #root { width: 1080px; height: 960px; }
#hero { position: absolute; inset: 0; }
#top { left: 0; right: 0; top: 62px; text-align: center; font-size: 44px; }
.age { position: absolute; top: 676px; width: 400px; margin-left: -200px; text-align: center; font-size: 170px; }
#chip { left: 676px; top: 76px; padding: 18px 30px; border-radius: 999px; background: var(--alarm); color: var(--paper); font-size: 64px; box-shadow: 0 18px 36px -14px color-mix(in srgb, var(--alarm) 70%, transparent); }
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4.6" data-fps="30" data-width="1080" data-height="960">
  <div id="hero">
    <div id="top" class="abs mono">Size</div>
    <svg id="stage" class="layer" width="1080" height="960"></svg>
    <div id="a1" class="abs disp age" style="left:290px">30</div>
    <div id="a2" class="abs disp age" style="left:790px">30</div>
    <div id="chip" class="abs disp">&minus;30%</div>
  </div>
</div>
<script src="kit.js"></script>
<script>
(function () {
/* INPUTS: from age, to age, loss (0..1 of area), top label. A cross-section: bundles inside a sheath. */
const IN = { from: 30, to: 70, loss: .30 };
const C = K.C, root = document.getElementById('root'); K.ground(root, { seed: 31 });
const tl = K.timeline(4.6); window.__timelines['main'] = tl;
const $ = id => document.getElementById(id), st = $('stage');
const R = 215, CY = 400, XA = 290, XB = 790, SB = Math.sqrt(1 - IN.loss);
// bundles: seeded circle packing inside the sheath (same layout in both discs)
const r = K.rng(5), fib = [];
for (let g = 0; g < 6000 && fib.length < 70; g++) { const rr = 15 + r() * 15, a = r() * Math.PI * 2, d = Math.sqrt(r()) * (R - 20 - rr);
  const x = Math.cos(a) * d, y = Math.sin(a) * d; if (fib.every(f => Math.hypot(f[0] - x, f[1] - y) > f[2] + rr + 5)) fib.push([x, y, rr]); }
fib.sort((p, q) => Math.hypot(p[0], p[1]) - Math.hypot(q[0], q[1]));
function disc(cx) {
  const g = K.mk(st, 'g', { transform: `translate(${cx} ${CY})` });
  const body = K.mk(g, 'circle', { r: R, fill: 'var(--paper)' });
  const fibs = fib.map(([x, y, rr]) => K.mk(g, 'circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: rr.toFixed(1), fill: C.accent, stroke: C.deep, 'stroke-width': 4 }));
  const sheath = K.mk(g, 'circle', { r: R, fill: 'none', stroke: C.onPaper, 'stroke-width': 10 });
  return { g, body, fibs, sheath };
}
const gap = K.mk(st, 'path', { d: `M${XB - R} ${CY} a${R} ${R} 0 1 0 ${2 * R} 0 a${R} ${R} 0 1 0 ${-2 * R} 0 M${XB - R * SB} ${CY} a${R * SB} ${R * SB} 0 1 1 ${2 * R * SB} 0 a${R * SB} ${R * SB} 0 1 1 ${-2 * R * SB} 0`,
  fill: 'color-mix(in srgb, var(--alarm) 22%, transparent)', 'fill-rule': 'evenodd', opacity: 0 });
const ghost = K.mk(st, 'circle', { cx: XB, cy: CY, r: R, fill: 'none', stroke: C.alarm, 'stroke-width': 6, 'stroke-dasharray': '2 18', 'stroke-linecap': 'round', opacity: 0 });
const A = disc(XA), B = disc(XB);
st.style.filter = 'drop-shadow(0 30px 30px color-mix(in srgb, var(--on-paper) 18%, transparent))';
// disc A builds: sheath draws, bundles pop centre-out
K.draw(A.sheath, 0, .55, 'power2.out'); tl.fromTo(A.body, { attr: { r: R * .7 }, opacity: 0 }, { attr: { r: R }, opacity: 1, duration: .5, ease: 'back.out(1.6)' }, 0.05);
A.fibs.forEach((f, k) => tl.fromTo(f, { scale: 0, transformOrigin: '50% 50%' }, { scale: 1, duration: .3, ease: 'back.out(2.5)' }, .15 + k * .009));
K.rise($('top'), .1); K.rise($('a1'), .35, 30);
// disc B slides out of A, then ages
tl.fromTo(B.g, { attr: { transform: `translate(${XA} ${CY}) scale(1)` } }, { attr: { transform: `translate(${XB} ${CY}) scale(1)` }, duration: .55, ease: 'power3.inOut' }, 1.0);
tl.fromTo(B.g, { opacity: 0 }, { opacity: 1, duration: .15 }, 1.0);
tl.fromTo($('a2'), { x: XA - XB, opacity: 0 }, { x: 0, opacity: 1, duration: .55, ease: 'power3.inOut' }, 1.0);
const S = { s: 1 };
tl.to(S, { s: SB, duration: 1.25, ease: 'power2.inOut', onUpdate: () => B.g.setAttribute('transform', `translate(${XB} ${CY}) scale(${S.s.toFixed(4)})`) }, 1.65);
K.count($('a2'), 1.65, IN.from, IN.to, 1.25, K.fmt.int, 'power2.inOut');
const lose = K.rng(77); B.fibs.forEach((f, k) => { if (lose() < IN.loss + .08) tl.to(f, { opacity: 0, scale: .4, transformOrigin: '50% 50%', duration: .3, ease: 'power2.in' }, 1.7 + lose() * 1.1);
  else tl.to(f, { attr: { fill: C.tint }, duration: .8 }, 1.9); });
// the loss, measured: ghost of the old size, red gap, one number
tl.to(ghost, { attr: { opacity: 1 }, duration: .2 }, 2.9); K.draw(ghost, 2.9, .5, 'power2.out');
tl.to(gap, { attr: { opacity: 1 }, duration: .4, ease: 'power2.out' }, 3.0);
K.land($('chip'), 3.15, { scale: .6, y: 20, rotation: -10 }, .5, 'back.out(2.4)');
K.pulse($('hero'), XB, CY, R * SB + 10, 3.55, C.alarm, 7);
tl.to(A.g, { opacity: .999, duration: .01 }, 0);
tl.to($('a1'), { y: -8, duration: .45, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 3.3);
K.exit($('hero'), 4.2, .38);
K.finish();
})();
</script></body></html>
