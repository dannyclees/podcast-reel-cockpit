<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#808080">
<title>Shorts</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23808080'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/brand.css">
<link rel="stylesheet" href="/app.css">
<script>
// Favicon and browser bar colour follow the brand. If brand.css is missing, the neutral grey above stays.
(() => {
  const css = getComputedStyle(document.documentElement), v = k => css.getPropertyValue(k).trim();
  const accent = v('--app-accent'), ink = v('--app-ink'), bg = v('--app-bg');
  if (!accent || !ink || !bg) return;
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='${ink}'/><rect x='14' y='18' width='36' height='8' rx='3' fill='${accent}'/><rect x='14' y='29' width='36' height='8' rx='3' fill='${bg}'/><rect x='14' y='40' width='36' height='8' rx='3' fill='${bg}'/></svg>`;
  document.getElementById('favicon').href = 'data:image/svg+xml,' + encodeURIComponent(svg);
  document.querySelector('meta[name=theme-color]').content = bg;
})();
</script>
</head>
<body>
<main id="app"><div class="loading"><i></i><i></i><i></i></div></main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/brand.js"></script>
<script src="/logos.js"></script>
<script src="/app.js"></script>
</body>
</html>
